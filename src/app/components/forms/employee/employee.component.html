<!-- Updated employee.component.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./employee.component.css">
</head>
<body>
  <div class="container mt-5">
    <div class="card shadow-lg border-0 p-4">
      <h3 class="text-center mb-4">Add New Employee</h3>
      <form [formGroup]="employeeForm" (ngSubmit)="onSubmit()" (reset)="onReset()">
        <div class="mb-3">
          <label for="empName" class="form-label">
            <span class="bi bi-person-fill me-2"></span>Full Name
          </label>
          <input type="text" id="empName" formControlName="empName" class="form-control" placeholder="Enter full name">
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">
            <span class="bi bi-envelope-fill me-2"></span>Email Address
          </label>
          <input type="email" id="email" formControlName="email" class="form-control" placeholder="example@domain.com">
        </div>

        <div class="d-flex justify-content-center gap-3">
          <button type="submit" class="btn btn-success" [disabled]="isLoading || employeeForm.invalid">
            <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2"></span>
            ➕ Add Employee
          </button>
          <button type="reset" class="btn btn-outline-secondary">Reset</button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
