<div class="container mt-5">
  <div class="card shadow-lg p-4 animate__animated animate__fadeIn">
    <h3 class="text-center mb-4">Add New Employee</h3>
    <form>
      <div class="mb-4 position-relative">
        <label for="empName" class="form-label">👤 Full Name</label>
        <input type="text" class="form-control form-control-lg" id="empName" placeholder="Enter full name" required>
      </div>
      <div class="mb-4 position-relative">
        <label for="email" class="form-label">📧 Email Address</label>
        <input type="email" class="form-control form-control-lg" id="email" placeholder="name@domain.com" required>
      </div>
      <div class="d-grid">
        <button type="submit" class="btn btn-success btn-lg">➕ Add Employee</button>
      </div>
    </form>
  </div>
</div>
